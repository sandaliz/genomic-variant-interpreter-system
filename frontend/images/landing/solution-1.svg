    <rect x="620" y="340" width="300" height="10" rx="5" fill="#E9EEF0"/>
    <rect x="620" y="340" width="284" height="10" rx="5" fill="#3F5F9A" opacity="0.9"/>
    <rect x="962" y="334" width="72" height="22" rx="11" fill="#1B3A61" opacity="0.85"/>
    <path d="M142,400 H1058" stroke="#EDF0F5" stroke-width="1"/>
  </g>
  <g>
    <circle cx="180" cy="450" r="17" fill="#E9EEF6"/>
