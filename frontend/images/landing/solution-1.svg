    <rect x="620" y="444" width="256" height="10" rx="5" fill="#3F5F9A" opacity="0.8"/>
    <rect x="980" y="438" width="54" height="22" rx="11" fill="#1B3A61" opacity="0.7"/>
    <path d="M142,504 H1058" stroke="#EDF0F5" stroke-width="1"/>
