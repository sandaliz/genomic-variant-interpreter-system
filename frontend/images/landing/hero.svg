<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="The VariantLens workspace: a plain-English query about a BRCA1 variant beside the Pathogenic call it produced, its confidence and the ACMG-style criteria applied">
  <!--
    VariantLens landing imagery - hero.

    This is the product, not a metaphor for it. The window is the workspace view
    with the one query the marketing page uses as its example, and every value in
    it is a real one: the gene and position come from the dataset, the criteria
    are codes classification_agent.py applies, and the confidence scale is the
    35 / 60 bar the engine uses. A hero showing an anonymous dashboard would be
    decoration; this one answers "what does it do".

    Drawn rather than photographed, so it can never drift out of step with the
    palette - every colour here is a token from app.css. To swap in a real
    screenshot instead, drop the file into this directory and point
    landingImages.hero at it in app.js; the frame crops with object-fit:cover,
    so any aspect works.

    Layout note: the frame is 4/3.4 on desktop but 16/10 at the 1000px
    breakpoint. The composition therefore lives inside x 212..1388 and survives
    both, and type is sized for the ~600px it actually renders at.
  -->
  <defs>
    <style>
      .s{font-family:Manrope,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
      .m{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
      .lbl{font-size:19px;font-weight:700;letter-spacing:2.6px;fill:#8A909B}
      .cap{font-size:16px;font-weight:700;letter-spacing:1.8px;fill:#8A909B}
    </style>

    <linearGradient id="heroBg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#0B1C34"/>
      <stop offset="0.55" stop-color="#142B4A"/>
      <stop offset="1" stop-color="#102541"/>
    </linearGradient>
    <radialGradient id="heroGlow" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#5C8AD4" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#3F5F9A" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#3F5F9A" stop-opacity="0"/>
    </radialGradient>
    <pattern id="heroGrid" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M100,0 H0 V100" fill="none" stroke="#8FB0E0" stroke-width="1"/>
    </pattern>
    <radialGradient id="heroVignette" cx="0.5" cy="0.5" r="0.74">
      <stop offset="0.44" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#061223" stop-opacity="0.58"/>
    </radialGradient>
    <!-- A flat drop-shadow bands against the gradient, so the window casts a
         real blur carrying the field's own colour. -->
    <filter id="heroShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="30" stdDeviation="34" flood-color="#040D1C" flood-opacity="0.62"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#heroBg)"/>
  <rect width="1600" height="1000" fill="url(#heroGrid)" opacity="0.06"/>
  <ellipse cx="800" cy="470" rx="720" ry="520" fill="url(#heroGlow)"/>

  <!-- ===== The workspace window ===== -->
  <rect x="240" y="120" width="1120" height="760" rx="18" fill="#FBFCFD" filter="url(#heroShadow)"/>
  <rect x="240.5" y="120.5" width="1119" height="759" rx="18" fill="none"
        stroke="#FFFFFF" stroke-opacity="0.12"/>

  <!-- Title bar. Two rects rather than a clip path: the second squares off the
       bottom corners the rounded title bar would otherwise leave behind. -->
  <rect x="240" y="120" width="1120" height="76" rx="18" fill="#102541"/>
  <rect x="240" y="170" width="1120" height="26" fill="#102541"/>
  <rect x="272" y="142" width="32" height="32" rx="9" fill="#3F5F9A"/>
  <text class="s" x="288" y="165" font-size="20" font-weight="700" fill="#FFFFFF"
        text-anchor="middle">V</text>
  <text class="s" x="316" y="166" font-size="26" font-weight="600" fill="#FFFFFF"
        letter-spacing="0.2">VariantLens</text>
  <rect x="1080" y="142" width="150" height="32" rx="16" fill="#1B3A61"/>
  <text class="s" x="1155" y="164" font-size="19" fill="#FFFFFF" text-anchor="middle">Workspace</text>
  <text class="s" x="1258" y="165" font-size="19" fill="#A9BBD6" text-anchor="end">History</text>
  <circle cx="1320" cy="158" r="17" fill="#3F5F9A"/>
  <text class="s" x="1320" y="165" font-size="18" font-weight="700" fill="#FFFFFF"
        text-anchor="middle">N</text>

  <!-- One hairline between the ask and the answer, the split the real workspace
       uses: the query rail on the left, the report on the right. -->
  <line x1="772" y1="224" x2="772" y2="800" stroke="#E8E8E8" stroke-width="1.5"/>

  <!-- ===== Left: the question ===== -->
  <text class="s lbl" x="280" y="252">QUERY</text>
  <rect x="280" y="272" width="470" height="176" rx="12" fill="#FFFFFF" stroke="#E8E8E8" stroke-width="1.5"/>
  <text class="s" x="308" y="330" font-size="30" font-weight="500" fill="#20242A">Is BRCA1 NC_000017.10:</text>
  <text class="s" x="308" y="372" font-size="30" font-weight="500" fill="#20242A">g.41244442A&gt;G pathogenic?</text>
  <!-- Caret parked after the last word, so the box reads as something typed. -->
  <rect x="696" y="350" width="3" height="32" fill="#3F5F9A"/>
  <rect x="654" y="398" width="76" height="34" rx="17" fill="#3F5F9A"/>
  <text class="s" x="692" y="421" font-size="17" font-weight="600" fill="#FFFFFF"
        text-anchor="middle">Analyse</text>

  <text class="s lbl" x="280" y="512">PARSED VARIANT</text>
  <text class="s cap" x="280" y="556">GENE</text>
  <text class="s" x="280" y="592" font-size="28" font-weight="600" fill="#20242A">BRCA1</text>
  <text class="s cap" x="546" y="556">RSID</text>
  <text class="m" x="546" y="592" font-size="24" fill="#20242A">rs80357906</text>
  <text class="s cap" x="280" y="656">POSITION</text>
  <text class="m" x="280" y="692" font-size="24" fill="#20242A">chr17:41,244,442</text>

  <!-- Intake screens the raw string before any agent runs, so the pass is part of
       the picture rather than a footnote about it. -->
  <rect x="280" y="724" width="300" height="48" rx="24" fill="#EAF2ED" stroke="#CDE0D4" stroke-width="1.5"/>
  <circle cx="312" cy="748" r="11" fill="#2F6B4F"/>
  <path d="M306.5,748.5 l4,4.5 l7,-9" fill="none" stroke="#FFFFFF" stroke-width="2.4"
        stroke-linecap="round" stroke-linejoin="round"/>
  <text class="s" x="334" y="756" font-size="21" font-weight="500" fill="#2F6B4F">Input screened</text>

  <!-- ===== Right: the answer ===== -->
  <text class="s lbl" x="800" y="252">CLASSIFICATION</text>
  <rect x="1180" y="232" width="140" height="30" rx="15" fill="#FBEDEA" stroke="#EFD3CD" stroke-width="1.5"/>
  <text class="s" x="1250" y="252" font-size="16" font-weight="500" fill="#A33A2E"
        text-anchor="middle">ACMG-style</text>
  <text class="s" x="800" y="352" font-size="92" font-weight="600" fill="#A33A2E"
        letter-spacing="-1.5">Pathogenic</text>

  <text class="s cap" x="800" y="414">CONFIDENCE</text>
  <rect x="800" y="430" width="420" height="14" rx="7" fill="#E6D2CE"/>
  <rect x="800" y="430" width="328" height="14" rx="7" fill="#A33A2E"/>
  <!-- The engine's own thresholds: 35 is moderate, 60 is high. They are drawn on
       the bar because the number alone does not say what it cleared. -->
  <line x1="947" y1="424" x2="947" y2="450" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="1052" y1="424" x2="1052" y2="450" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.6"/>
  <text class="m" x="1240" y="444" font-size="24" fill="#A33A2E" text-anchor="end">78</text>
  <text class="s" x="800" y="478" font-size="16" fill="#8A909B">high confidence · thresholds 35 / 60</text>

  <text class="s cap" x="800" y="530">CRITERIA APPLIED</text>
  <rect x="800" y="546" width="130" height="52" rx="10" fill="#FBEDEA" stroke="#E3BDB6" stroke-width="1.5"/>
  <text class="m" x="865" y="580" font-size="24" font-weight="700" fill="#A33A2E" text-anchor="middle">PVS1</text>
  <rect x="946" y="546" width="130" height="52" rx="10" fill="#FBF1DE" stroke="#EAD9B4" stroke-width="1.5"/>
  <text class="m" x="1011" y="580" font-size="24" font-weight="700" fill="#8C6210" text-anchor="middle">PM2</text>
  <rect x="1092" y="546" width="130" height="52" rx="10" fill="#FBF1DE" stroke="#EAD9B4" stroke-width="1.5"/>
  <text class="m" x="1157" y="580" font-size="24" font-weight="700" fill="#8C6210" text-anchor="middle">PP3</text>
  <text class="s" x="800" y="626" font-size="15" fill="#8A909B">PVS1 very strong · PM2 moderate · PP3 supporting</text>

  <!-- The verifier is the stage a screenshot of any other tool would not have,
       and it is what the product is built around, so it gets its own block. -->
  <rect x="800" y="652" width="520" height="106" rx="12" fill="#FFFFFF" stroke="#E8E8E8" stroke-width="1.5"/>
  <rect x="800" y="652" width="5" height="106" rx="2.5" fill="#3F5F9A"/>
  <text class="s cap" x="828" y="686">VERIFIER</text>
  <text class="s" x="828" y="718" font-size="22" font-weight="600" fill="#20242A">Confidence claim upheld</text>
  <text class="s" x="828" y="744" font-size="16" fill="#8A909B">one round only · a revision can only lower the call</text>

  <line x1="280" y1="800" x2="1320" y2="800" stroke="#E8E8E8" stroke-width="1.5"/>
  <text class="m" x="280" y="838" font-size="16" fill="#8A909B">trace 8f3c1d · 3,009 ClinVar records indexed · top 5 · RRF fusion</text>

  <rect width="1600" height="1000" fill="url(#heroVignette)"/>
</svg>
