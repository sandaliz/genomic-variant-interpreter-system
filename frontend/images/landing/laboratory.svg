<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A laboratory bench with a microplate and a rack of pipette tips">
  <!-- VarientLens landing imagery -- laboratory. Used as the low-opacity field
       behind the closing call to action, so it is drawn dark and wide. -->
  <defs>
    <linearGradient id="lbBg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#0B1C34"/>
      <stop offset="0.55" stop-color="#142B4A"/>
      <stop offset="1" stop-color="#0A1A30"/>
    </linearGradient>
    <radialGradient id="lbGlow" cx="0.32" cy="0.36" r="0.55">
      <stop offset="0" stop-color="#4E7BC4" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#4E7BC4" stop-opacity="0"/>
    </radialGradient>

    <!-- A 96-well plate, 12 x 8. -->
    <pattern id="lbWells" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="17" cy="17" r="11.5" fill="#3F5F9A" opacity="0.5"/>
      <circle cx="17" cy="17" r="11.5" fill="none" stroke="#8FB0E0" stroke-width="1" opacity="0.3"/>
    </pattern>

    <!-- A rack of pipette tips. -->
    <pattern id="lbTips" width="46" height="240" patternUnits="userSpaceOnUse">
      <path d="M7,0 H39 L27,190 H19 Z" fill="#24406B" opacity="0.9"/>
      <path d="M7,0 H39" stroke="#8FB0E0" stroke-width="2" opacity="0.35"/>
      <path d="M23,190 H23" stroke="#8FB0E0" stroke-width="2" opacity="0.5"/>
    </pattern>

    <pattern id="lbGrid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80,0 H0 V80" fill="none" stroke="#8FB0E0" stroke-width="1"/>
    </pattern>
    <linearGradient id="lbStreak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8FB0E0" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#8FB0E0" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#8FB0E0" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#lbBg)"/>
  <rect width="1920" height="1080" fill="url(#lbGrid)" opacity="0.05"/>
  <ellipse cx="614" cy="390" rx="820" ry="560" fill="url(#lbGlow)"/>

  <!-- Instrument bodies behind the bench. -->
  <rect x="96" y="88" width="620" height="300" rx="14" fill="#1B3A61" opacity="0.75"/>
  <rect x="132" y="126" width="300" height="14" rx="7" fill="#526FA8" opacity="0.6"/>
  <rect x="132" y="158" width="180" height="10" rx="5" fill="#3F5F9A" opacity="0.7"/>
  <rect x="132" y="200" width="548" height="150" rx="8" fill="#102541" opacity="0.8"/>
  <path d="M156,326 L214,272 L268,300 L330,224 L392,262 L452,196 L512,238 L574,180 L640,220"
        fill="none" stroke="#8FB0E0" stroke-width="3" opacity="0.55"/>
  <rect x="1260" y="120" width="564" height="268" rx="14" fill="#1B3A61" opacity="0.7"/>
  <rect x="1300" y="164" width="484" height="12" rx="6" fill="#526FA8" opacity="0.55"/>
  <rect x="1300" y="196" width="360" height="12" rx="6" fill="#3F5F9A" opacity="0.5"/>
  <rect x="1300" y="240" width="484" height="104" rx="8" fill="#102541" opacity="0.75"/>
  <g fill="#3F5F9A">
    <rect x="1320" y="292" width="30" height="32"/>
    <rect x="1368" y="272" width="30" height="52"/>
    <rect x="1416" y="256" width="30" height="68"/>
    <rect x="1464" y="284" width="30" height="40"/>
    <rect x="1512" y="264" width="30" height="60"/>
    <rect x="1560" y="248" width="30" height="76"/>
    <rect x="1608" y="276" width="30" height="48"/>
    <rect x="1656" y="260" width="30" height="64"/>
    <rect x="1704" y="288" width="30" height="36"/>
  </g>

  <!-- Bench line -->
  <path d="M0,660 H1920" stroke="#8FB0E0" stroke-width="1" opacity="0.2"/>

  <!-- Microplate and tip rack on the bench. -->
  <rect x="150" y="700" width="408" height="272" rx="10" fill="#132B4B" opacity="0.9"/>
  <rect x="150" y="700" width="408" height="272" rx="10" fill="url(#lbWells)"/>
  <rect x="120" y="694" width="468" height="14" rx="6" fill="#24406B"/>
  <rect x="820" y="720" width="920" height="240" fill="url(#lbTips)"/>
  <rect x="800" y="700" width="960" height="20" rx="8" fill="#24406B"/>

  <!-- Light streaks across the frame. -->
  <path d="M0,806 H1920" stroke="url(#lbStreak)" stroke-width="2"/>
  <path d="M0,392 H1920" stroke="url(#lbStreak)" stroke-width="1.5"/>
  <path d="M0,540 H1920" stroke="url(#lbStreak)" stroke-width="1.5"/>
</svg>
