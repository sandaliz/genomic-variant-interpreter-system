# Local PostgreSQL for VariantLens (development only).
#
# The host port is 5433 rather than 5432 because 5432 is commonly already
# taken by a locally installed PostgreSQL server (Homebrew, Postgres.app, ...).
#
#   docker compose up -d       start
#   docker compose ps          health
#   docker compose down        stop (keeps the volume)
#   docker compose down -v     stop and DELETE all data
#
services:
  db:
    image: postgres:16-alpine
    container_name: variantlens-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: variantlens
      POSTGRES_USER: variantlens
      POSTGRES_PASSWORD: development_password
    ports:
      - "5433:5432"
    volumes:
      - variantlens_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U variantlens -d variantlens"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build: .
    container_name: variantlens-api
    restart: unless-stopped
    # Only the internal port: PostgreSQL is reachable from the host, but the API
    # itself is published on 8000 to keep it identical to `uvicorn api:app`.
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://variantlens:development_password@db:5432/variantlens
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:8000}
    depends_on:
      db:
        # Waiting for healthy, not just started: alembic runs on API start and
        # would fail against a database that is still initialising.
        condition: service_healthy

volumes:
  variantlens_pgdata:
